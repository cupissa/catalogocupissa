<!-- MODAL DETALLE CLIENTE WEB & GESTIÓN DE CRÉDITO -->
    <div id="modal-detalle-cliente-web" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl max-w-xl w-full p-6 space-y-5 shadow-2xl text-xs relative max-h-[90vh] overflow-y-auto">
            <button onclick="document.getElementById('modal-detalle-cliente-web').classList.add('hidden')" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <div class="border-b pb-3">
                <h3 id="cli-web-modal-nombre" class="text-base font-black text-indigo-900"></h3>
                <div class="flex flex-wrap gap-4 text-slate-500 mt-1">
                    <span><i class="fa-solid fa-envelope text-indigo-500 mr-1"></i> <span id="cli-web-modal-email"></span></span>
                    <span><i class="fa-solid fa-phone text-indigo-500 mr-1"></i> <span id="cli-web-modal-tel"></span></span>
                    <span><i class="fa-solid fa-location-dot text-indigo-500 mr-1"></i> <span id="cli-web-modal-dir"></span></span>
                </div>
            </div>

            <!-- INDICADORES FINANCIEROS SEPARADOS -->
            <div class="grid grid-cols-2 gap-3 bg-slate-50 p-3 rounded-2xl border text-center">
                <div class="p-2 bg-white rounded-xl border">
                    <span class="text-[10px] text-slate-400 uppercase font-bold block">Cupo de Crédito Asignado</span>
                    <span id="cli-web-modal-cupo-display" class="text-sm font-black text-indigo-600">$0</span>
                </div>
                <div class="p-2 bg-white rounded-xl border">
                    <span class="text-[10px] text-slate-400 uppercase font-bold block">Deuda Actual a Crédito</span>
                    <span id="cli-web-modal-deuda-display" class="text-sm font-black text-rose-600">$0</span>
                </div>
            </div>

            <!-- GESTIÓN DE CRÉDITO -->
            <form id="form-credito-cliente-web" onsubmit="guardarCreditoClienteWeb(event)" class="bg-amber-50/80 p-4 rounded-2xl border border-amber-200 space-y-3">
                <input type="hidden" id="cli-web-id-hidden">
                <h4 class="font-black text-amber-900 uppercase tracking-wider text-[11px] flex items-center gap-1.5">
                    <i class="fa-solid fa-shield-halved text-amber-600"></i> Condición y Cupo de Crédito Cupissa
                </h4>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Cupo de Crédito ($)</label>
                        <input type="text" id="cli-web-cupo-input" placeholder="200000" class="p-2 border rounded-xl w-full bg-white font-bold text-amber-800">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Estado del Cupo</label>
                        <select id="cli-web-estado-credito-select" class="p-2 border rounded-xl w-full bg-white font-semibold">
                            <option value="aprobado">Aprobado</option>
                            <option value="pendiente">Por Aprobar</option>
                            <option value="rechazado">Rechazado</option>
                            <option value="sin_solicitud">Sin Solicitud</option>
                        </select>
                    </div>
                </div>

                <!-- FECHA LÍMITE DE PAGO (SOLO APARECE SI TIENE DEUDA ACTIVA) -->
                <div id="box-fecha-limite-pago" class="p-2.5 bg-rose-50 border border-rose-200 rounded-xl space-y-1 hidden">
                    <label class="block font-bold text-rose-900 text-[11px]">📅 Fecha Límite de Pago de la Deuda Activa</label>
                    <input type="date" id="cli-web-fecha-pago-input" class="p-2 border rounded-xl w-full bg-white text-xs">
                    <p class="text-[10px] text-rose-600">Aplica únicamente porque el cliente registra saldo pendiente en compras a crédito.</p>
                </div>

                <div class="flex justify-end pt-1">
                    <button type="submit" class="bg-amber-600 hover:bg-amber-700 text-white font-extrabold px-4 py-2 rounded-xl text-xs shadow transition">
                        💾 Guardar Ajustes de Crédito
                    </button>
                </div>
            </form>

            <!-- HISTORIAL DE PEDIDOS -->
            <div>
                <h4 class="font-bold text-slate-800 mb-2 uppercase text-[11px]">Historial de Compras y Solicitudes</h4>
                <div id="cli-web-modal-pedidos-list" class="space-y-2 max-h-48 overflow-y-auto"></div>
            </div>
        </div>
    </div>
