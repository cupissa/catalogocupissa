<section id="tab-inventario" class="hidden space-y-4 sm:space-y-6 animate-fade-in">
            <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-base sm:text-lg font-bold text-indigo-700">📦 Registrar / Editar Producto en Supabase</h2>
                    <span class="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-1 rounded-full">Sincronizado Supabase</span>
                </div>
                <form id="form-producto-admin" class="grid grid-cols-1 sm:grid-cols-4 gap-3 text-xs">
                    <input type="hidden" id="prod-id-edit">
                    <input type="hidden" id="prod-imagen-url-hidden">
                    
                    <div>
                        <label class="font-semibold text-slate-500">Nombre del Producto *</label>
                        <input type="text" id="prod-nombre" placeholder="Nombre completo" required class="p-2.5 border rounded-xl w-full mt-1 bg-slate-50">
                    </div>
                    <div>
                        <label class="font-semibold text-slate-500">Mundo / Categoría *</label>
                        <input type="text" id="prod-mundo" placeholder="Ej: EVENTOS, FAMILIAR, B2B..." required class="p-2.5 border rounded-xl w-full mt-1 bg-slate-50">
                    </div>
                    <div>
                        <label class="font-semibold text-slate-500">Origen de Compra</label>
                        <select id="prod-origen" class="p-2.5 border rounded-xl font-semibold w-full mt-1 bg-slate-50">
                            <option value="Colombia">Colombia</option>
                            <option value="Venezuela">Venezuela</option>
                            <option value="Online (Temu u otro)">Online (Temu / Otro)</option>
                        </select>
                    </div>
                    <div class="flex items-center gap-2 pt-5">
                        <input type="checkbox" id="prod-sin-stock" class="w-4 h-4 text-indigo-600 rounded">
                        <label for="prod-sin-stock" class="font-bold text-slate-600">Sin Stock (Bajo Pedido)</label>
                    </div>
                    <div>
                        <label class="font-semibold text-slate-500">Stock Actual</label>
                        <input type="number" id="prod-stock" value="10" placeholder="0" class="p-2.5 border rounded-xl w-full mt-1 bg-slate-50">
                    </div>
                    <div>
                        <label class="font-semibold text-slate-500">Precio Detal ($) *</label>
                        <input type="text" id="prod-detal" placeholder="0" required class="p-2.5 border rounded-xl w-full mt-1 font-bold text-indigo-700 bg-slate-50">
                    </div>
                    <div>
                        <label class="font-semibold text-slate-500">Precio Mayorista ($) *</label>
                        <input type="text" id="prod-mayor" placeholder="0" required class="p-2.5 border rounded-xl w-full mt-1 font-bold text-amber-700 bg-slate-50">
                    </div>

                    <!-- SUBIDA DE IMAGEN COMPATIBLE -->
                    <div class="sm:col-span-2 bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                        <label class="font-semibold text-slate-500 block mb-1">Imagen del Producto (Foto Supabase)</label>
                        <div class="flex items-center gap-2">
                            <input type="file" id="prod-foto-file" accept="image/*" class="w-full text-[11px] text-slate-500 bg-white rounded-xl border p-1.5 file:mr-2 file:py-1 file:px-2 file:rounded-lg file:border-0 file:text-[10px] file:font-bold file:bg-indigo-50 file:text-indigo-700">
                            <img id="prod-foto-preview" src="assets/images/logo.png" class="w-10 h-10 object-contain rounded-lg border bg-white shrink-0">
                        </div>
                    </div>

                    <div class="flex items-end gap-2 sm:col-span-2 pt-1 sm:pt-0">
                        <button type="submit" id="btn-guardar-prod" class="bg-indigo-600 hover:bg-indigo-700 text-white p-2.5 rounded-xl font-bold w-full transition shadow">💾 Guardar Catálogo</button>
                        <button type="button" id="btn-cancelar-edit-prod" onclick="cancelarEdicionProd()" class="hidden bg-slate-300 hover:bg-slate-400 p-2.5 rounded-xl font-bold">Cancelar</button>
                    </div>
                </form>
            </div>

            <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                    <div>
                        <h2 class="text-base sm:text-lg font-bold text-slate-800">Catálogo Supabase (<span id="count-productos-inv">0</span>)</h2>
                        <p class="text-xs text-slate-400">Suma stock directo (+ / -) y edita en tiempo real</p>
                    </div>
                    <div class="flex flex-wrap gap-2 w-full sm:w-auto">
                        <select id="filtro-origen-inv" onchange="cargarInventarioAdmin()" class="p-2.5 border rounded-xl text-xs bg-slate-50 font-semibold">
                            <option value="todos">Todos los Orígenes</option>
                            <option value="Venezuela">Venezuela</option>
                            <option value="Colombia">Colombia</option>
                            <option value="Online">Online / Temu</option>
                        </select>
                        <input type="text" id="buscador-inventario" placeholder="🔍 Buscar producto..." oninput="cargarInventarioAdmin()" class="p-2.5 border rounded-xl text-xs w-full sm:w-64 bg-slate-50">
                    </div>
                </div>
                <div class="overflow-x-auto border rounded-xl">
                    <table class="w-full text-left border-collapse sheets-table">
                        <thead>
                            <tr><th>Ref / Origen</th><th>Producto & Mundo</th><th>Stock (+ / -)</th><th>Precios (Detal / Mayor)</th><th>Acciones</th></tr>
                        </thead>
                        <tbody id="tabla-inventario-admin" class="text-xs"></tbody>
                    </table>
                </div>
            </div>
        </section>
