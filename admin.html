<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUPISSA - Control de Mando Administración</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#fdf2f8', 500: '#ec4899', 600: '#db2777', 700: '#be185d' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col">

  <!-- BARRAS SUPERIOR ADMIN -->
  <header class="bg-gray-900 text-white border-b border-gray-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <img src="images/logo.png" alt="Cupissa" class="h-8 w-auto">
        <span class="bg-brand-600 text-white text-[10px] font-black px-2.5 py-0.5 rounded-full uppercase">Panel General Diani</span>
      </div>
      <div class="flex items-center space-x-4">
        <span id="adminUserEmail" class="text-xs text-gray-400 font-medium"></span>
        <button onclick="handleAdminLogout()" class="text-xs bg-red-600 hover:bg-red-700 text-white font-bold py-1.5 px-3 rounded-lg transition-colors">
          <i class="fa-solid fa-right-from-bracket mr-1"></i> Cerrar Sesión
        </button>
      </div>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full grid grid-cols-1 md:grid-cols-4 gap-6">
    
    <!-- MENÚ LATERAL -->
    <aside class="space-y-2">
      <button onclick="switchAdminTab('products')" id="tabBtnProducts" class="w-full text-left py-3 px-4 rounded-xl text-xs font-bold bg-brand-600 text-white shadow-sm flex items-center gap-2">
        <i class="fa-solid fa-box-open"></i> Productos y Catálogo
      </button>
      <button onclick="switchAdminTab('orders')" id="tabBtnOrders" class="w-full text-left py-3 px-4 rounded-xl text-xs font-bold bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 hover:bg-gray-50 flex items-center gap-2">
        <i class="fa-solid fa-receipt"></i> Pedidos y Agendamientos
      </button>
      <button onclick="switchAdminTab('credits')" id="tabBtnCredits" class="w-full text-left py-3 px-4 rounded-xl text-xs font-bold bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 hover:bg-gray-50 flex items-center gap-2">
        <i class="fa-solid fa-shield-halved"></i> Créditos Cupissa
      </button>
    </aside>

    <!-- ÁREA DE CONTENIDO -->
    <main class="md:col-span-3 space-y-6">

      <!-- PESTAÑA: PRODUCTOS -->
      <section id="adminSecProducts" class="bg-white dark:bg-gray-800 rounded-3xl p-6 shadow-sm border border-gray-200 dark:border-gray-700 space-y-6">
        <div class="flex justify-between items-center border-b border-gray-100 dark:border-gray-700 pb-4">
          <h2 class="text-base font-black text-gray-900 dark:text-white">Gestión de Productos e Insumos</h2>
          <button onclick="openProductModal()" class="bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold py-2 px-4 rounded-xl shadow-sm flex items-center gap-1.5">
            <i class="fa-solid fa-plus"></i> Nuevo Producto
          </button>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs border-collapse">
            <thead>
              <tr class="border-b border-gray-200 dark:border-gray-700 text-gray-400">
                <th class="py-2">Producto</th>
                <th class="py-2">Precio Base</th>
                <th class="py-2">% Anticipo</th>
                <th class="py-2">Días Prod.</th>
                <th class="py-2">% Interés</th>
                <th class="py-2">Acciones</th>
              </tr>
            </thead>
            <tbody id="adminProductsTableBody">
              <!-- Carga dinámica -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- PESTAÑA: SOLICITUDES DE CRÉDITO -->
      <section id="adminSecCredits" class="hidden bg-white dark:bg-gray-800 rounded-3xl p-6 shadow-sm border border-gray-200 dark:border-gray-700 space-y-6">
        <div class="border-b border-gray-100 dark:border-gray-700 pb-4">
          <h2 class="text-base font-black text-gray-900 dark:text-white">Evaluación de Créditos Cupissa</h2>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs border-collapse">
            <thead>
              <tr class="border-b border-gray-200 dark:border-gray-700 text-gray-400">
                <th class="py-2">Solicitante</th>
                <th class="py-2">Monto Financiado</th>
                <th class="py-2">Periodicidad</th>
                <th class="py-2">Cuotas</th>
                <th class="py-2">Documentos</th>
                <th class="py-2">Estado</th>
                <th class="py-2">Decisión</th>
              </tr>
            </thead>
            <tbody id="adminCreditsTableBody">
              <!-- Carga dinámica -->
            </tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config/supabase.js"></script>
  <script src="js/pages/admin-page.js" type="module"></script>
</body>
</html>
