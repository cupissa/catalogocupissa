<!doctype html><html lang="es" class="scroll-smooth"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Solicitar crédito | Cupissa</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>window.supabaseSDK=window.supabase;</script><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/components.css"></head><body class="min-h-screen bg-gray-50 text-gray-800 dark:bg-gray-950 dark:text-gray-100"><main class="mx-auto max-w-3xl p-4 py-8"><nav class="mb-6 flex justify-between"><a href="profile.html" class="font-bold text-pink-700">← Mi perfil</a><button id="theme-toggle" class="rounded-xl border px-3 py-2">☀️ / 🌙 Tema</button></nav><header class="mb-6"><p class="text-sm font-bold uppercase tracking-widest text-pink-600">Crédito Cupissa</p><h1 class="mt-1 text-3xl font-black">Solicitar o aumentar cupo</h1><p class="mt-2 text-sm text-gray-500 dark:text-gray-400">Completa los datos y adjunta los documentos requeridos. La solicitud queda pendiente hasta revisión.</p></header><form id="creditPageForm" class="space-y-5 rounded-2xl border bg-white p-5 shadow-sm dark:border-gray-800 dark:bg-gray-900"><div class="grid gap-3 sm:grid-cols-2"><input name="nombre" required placeholder="Nombre" class="rounded-xl border bg-transparent p-3"><input name="apellido" required placeholder="Apellido" class="rounded-xl border bg-transparent p-3"><input name="cedula" required placeholder="Cédula" class="rounded-xl border bg-transparent p-3"><input name="telefono" required type="tel" placeholder="Teléfono" class="rounded-xl border bg-transparent p-3"><input name="correo" required type="email" placeholder="Correo electrónico" class="rounded-xl border bg-transparent p-3 sm:col-span-2"><input name="direccion" placeholder="Dirección" class="rounded-xl border bg-transparent p-3"><input name="ciudad" placeholder="Ciudad" class="rounded-xl border bg-transparent p-3"><input name="barrio" placeholder="Barrio" class="rounded-xl border bg-transparent p-3 sm:col-span-2"></div><div class="grid gap-3 sm:grid-cols-3"><label class="text-sm font-bold">Foto tipo carnet *<input name="foto_carnet" required type="file" accept="image/*" class="mt-2 block w-full rounded-xl border p-2 text-xs"></label><label class="text-sm font-bold">Cédula frontal *<input name="cedula_frente" required type="file" accept="image/*" class="mt-2 block w-full rounded-xl border p-2 text-xs"></label><label class="text-sm font-bold">Cédula posterior *<input name="cedula_reverso" required type="file" accept="image/*" class="mt-2 block w-full rounded-xl border p-2 text-xs"></label></div><h2 class="text-lg font-extrabold">Dos referencias personales</h2><div class="grid gap-3 sm:grid-cols-2"><input name="ref1_nombre" required placeholder="Referencia 1: nombre y apellido" class="rounded-xl border bg-transparent p-3"><input name="ref1_telefono" required type="tel" placeholder="Teléfono referencia 1" class="rounded-xl border bg-transparent p-3"><input name="ref2_nombre" required placeholder="Referencia 2: nombre y apellido" class="rounded-xl border bg-transparent p-3"><input name="ref2_telefono" required type="tel" placeholder="Teléfono referencia 2" class="rounded-xl border bg-transparent p-3"></div><label class="block text-sm font-bold">Cupo que solicitas (opcional)<input name="cupo_solicitado" type="number" min="200000" step="10000" placeholder="Ej. 500000" class="mt-1 w-full rounded-xl border bg-transparent p-3"></label><button id="submitCredit" class="w-full rounded-xl bg-pink-600 p-3 font-black text-white">Enviar solicitud de crédito</button><p id="creditPageMessage" role="status" class="text-sm"></p></form></main><script src="../shared/js/config/constants.js"></script><script src="../shared/js/config/supabase.js"></script><script src="js/utils/theme.js"></script><script src="js/pages/credit-page.js"></script></body></html>
