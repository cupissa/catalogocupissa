<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:{50:'#fdf2f8',100:'#fce7f3',500:'#ec4899',600:'#db2777',700:'#be185d',950:'#500724'}}}}};</script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head><body data-page="credit" class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 antialiased min-h-screen flex flex-col transition-colors duration-200 overflow-x-hidden">
<div id="toast-container" class="fixed bottom-5 right-5 z-50 space-y-2 pointer-events-none"></div><div data-partial="views/home/header.html"></div>
<main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
<header class="mb-6"><p class="text-sm font-bold uppercase tracking-widest text-brand-600">Crédito Cupissa</p><h1 class="mt-1 text-3xl font-black">Solicitar o aumentar cupo</h1><p class="mt-2 text-sm text-gray-500 dark:text-gray-400">Completa los datos y adjunta los documentos requeridos. La solicitud queda pendiente hasta revisión.</p></header><form id="creditPageForm" class="space-y-5 rounded-2xl border bg-white p-5 shadow-sm dark:border-gray-800 dark:bg-gray-900"><div class="grid gap-3 sm:grid-cols-2"><input name="nombre" required placeholder="Nombre" class="rounded-xl border bg-transparent p-3"><input name="apellido" required placeholder="Apellido" class="rounded-xl border bg-transparent p-3"><input name="cedula" required placeholder="Cédula" class="rounded-xl border bg-transparent p-3"><input name="telefono" required type="tel" placeholder="Teléfono" class="rounded-xl border bg-transparent p-3"><input name="correo" required type="email" placeholder="Correo electrónico" class="rounded-xl border bg-transparent p-3 sm:col-span-2"><input name="direccion" placeholder="Dirección" class="rounded-xl border bg-transparent p-3"><input name="ciudad" placeholder="Ciudad" class="rounded-xl border bg-transparent p-3"><input name="barrio" placeholder="Barrio" class="rounded-xl border bg-transparent p-3 sm:col-span-2"></div><div class="grid gap-3 sm:grid-cols-3"><label class="text-sm font-bold">Foto tipo carnet *<input name="foto_carnet" required type="file" accept="image/*" class="mt-2 block w-full rounded-xl border p-2 text-xs"></label><label class="text-sm font-bold">Cédula frontal *<input name="cedula_frente" required type="file" accept="image/*" class="mt-2 block w-full rounded-xl border p-2 text-xs"></label><label class="text-sm font-bold">Cédula posterior *<input name="cedula_reverso" required type="file" accept="image/*" class="mt-2 block w-full rounded-xl border p-2 text-xs"></label></div><h2 class="text-lg font-extrabold">Dos referencias personales</h2><div class="grid gap-3 sm:grid-cols-2"><input name="ref1_nombre" required placeholder="Referencia 1: nombre y apellido" class="rounded-xl border bg-transparent p-3"><input name="ref1_telefono" required type="tel" placeholder="Teléfono referencia 1" class="rounded-xl border bg-transparent p-3"><input name="ref2_nombre" required placeholder="Referencia 2: nombre y apellido" class="rounded-xl border bg-transparent p-3"><input name="ref2_telefono" required type="tel" placeholder="Teléfono referencia 2" class="rounded-xl border bg-transparent p-3"></div><label class="block text-sm font-bold">Cupo que solicitas (opcional)<input name="cupo_solicitado" type="number" min="200000" step="10000" placeholder="Ej. 500000" class="mt-1 w-full rounded-xl border bg-transparent p-3"></label><button id="submitCredit" class="w-full rounded-xl bg-brand-600 p-3 font-black text-white">Enviar solicitud de crédito</button><p id="creditPageMessage" role="status" class="text-sm"></p></form></main><div data-partial="views/home/footer.html"></div>

<script src="js/core/page-bootstrap.js"></script></body></html>
